<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../shared.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculadora</title>
  </head>
  <body>
    <a class="voltar" href="../">← Mini projetos</a>
    <main class="card calc">
      <div class="display" aria-live="polite">
        <div id="anterior" class="anterior"></div>
        <div id="atual" class="atual">0</div>
      </div>
      <div class="teclas">
        <button class="fn" data-acao="limpar">AC</button>
        <button class="fn" data-acao="apagar">⌫</button>
        <button class="fn" data-acao="porcento">%</button>
        <button class="op" data-op="÷">÷</button>
        <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
        <button class="op" data-op="×">×</button>
        <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
        <button class="op" data-op="−">−</button>
        <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
        <button class="op" data-op="+">+</button>
        <button data-num="0" class="zero">0</button>
        <button data-num=",">,</button>
        <button class="igual" data-acao="igual">=</button>
      </div>
      <p class="dica">Dica: dá para usar o teclado do computador.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
