<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de Tarefas</title>
  <style>
    body { font-family: Arial; max-width: 400px; margin: 40px auto; }
    li { padding: 6px 0; cursor: pointer; }
    li.feito { text-decoration: line-through; color: #999; }
    input { padding: 10px; width: 70%; }
    button { padding: 10px; }
  </style>
</head>
<body>
  <h2>Minhas tarefas</h2>
  <input id="nova" placeholder="Nova tarefa">
  <button onclick="add()">Adicionar</button>
  <p><small>Clique = concluir | Botão direito = apagar</small></p>
  <ul id="lista"></ul>
  <script>
    let tarefas = JSON.parse(localStorage.getItem("tarefas") || "[]");
    function salvar() { localStorage.setItem("tarefas", JSON.stringify(tarefas)); render(); }
    function add() {
      const t = document.getElementById("nova").value.trim();
      if (!t) return;
      tarefas.push({ texto: t, feito: false });
      document.getElementById("nova").value = "";
      salvar();
    }
    function render() {
      const ul = document.getElementById("lista");
      ul.innerHTML = "";
      tarefas.forEach((t, i) => {
        const li = document.createElement("li");
        li.textContent = t.texto;
        if (t.feito) li.className = "feito";
        li.onclick = () => { tarefas[i].feito = !tarefas[i].feito; salvar(); };
        li.oncontextmenu = e => { e.preventDefault(); tarefas.splice(i, 1); salvar(); };
        ul.appendChild(li);
      });
    }
    render();
  </script>
</body>
</html>
