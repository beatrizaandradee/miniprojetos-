<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de IMC</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f4f8; display: flex; justify-content: center; padding: 40px; }
    .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 12px #0002; width: 300px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { background: #4a90e2; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    #resultado { margin-top: 16px; font-weight: bold; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Calculadora de IMC</h2>
    <input id="peso" type="number" placeholder="Peso (kg)">
    <input id="altura" type="number" step="0.01" placeholder="Altura (m) ex: 1.65">
    <button onclick="calcular()">Calcular</button>
    <p id="resultado"></p>
  </div>
  <script>
    function calcular() {
      const peso = parseFloat(document.getElementById("peso").value);
      const altura = parseFloat(document.getElementById("altura").value);
      const out = document.getElementById("resultado");
      if (!peso || !altura || peso <= 0 || altura <= 0) {
        out.textContent = "Preencha peso e altura corretamente.";
        return;
      }
      const imc = peso / (altura * altura);
      let classe;
      if (imc < 18.5) classe = "Abaixo do peso";
      else if (imc < 25) classe = "Peso normal";
      else if (imc < 30) classe = "Sobrepeso";
      else if (imc < 35) classe = "Obesidade grau I";
      else if (imc < 40) classe = "Obesidade grau II";
      else classe = "Obesidade grau III";
      out.textContent = `IMC: ${imc.toFixed(1)} - ${classe}`;
    }
  </script>
</body>
</html>
