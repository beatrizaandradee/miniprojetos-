<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de Senha</title>
  <style>
    body { font-family: Arial; max-width: 340px; margin: 40px auto; }
    input[type=range], input#senha, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    #senha { font-family: monospace; font-size: 18px; }
  </style>
</head>
<body>
  <h2>Gerador de Senha</h2>
  <label>Tamanho: <span id="tam">12</span></label>
  <input type="range" id="tamanho" min="6" max="32" value="12"
         oninput="document.getElementById('tam').textContent = this.value">
  <label><input type="checkbox" id="num" checked> Números</label><br>
  <label><input type="checkbox" id="sim" checked> Símbolos</label>
  <button onclick="gerar()">Gerar</button>
  <input id="senha" readonly>
  <button onclick="copiar()">Copiar</button>
  <script>
    function gerar() {
      let chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
      if (document.getElementById("num").checked) chars += "0123456789";
      if (document.getElementById("sim").checked) chars += "!@#$%&*?";
      const n = +document.getElementById("tamanho").value;
      const arr = crypto.getRandomValues(new Uint32Array(n));
      document.getElementById("senha").value =
        Array.from(arr, x => chars[x % chars.length]).join("");
    }
    function copiar() {
      const s = document.getElementById("senha");
      s.select();
      navigator.clipboard.writeText(s.value);
    }
  </script>
</body>
</html>
